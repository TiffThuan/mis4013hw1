<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body>

<h1>Contact Us</h1>
<div id="scatterChart" style="width: 600px; height: 400px;"></div>

<script>
    const scatterChart = echarts.init(document.getElementById('scatterChart'));
    const scatterOption = {
        title: {
            text: 'Customer Feedback Trends'
        },
        xAxis: {
            type: 'category',
            data: ['Timeliness', 'Satisfaction', 'Clarity']
        },
        yAxis: {
            type: 'value'
        },
        series: [{
            symbolSize: 20,
            data: [[0, 90], [1, 80], [2, 70]],
            type: 'scatter'
        }]
    };
    scatterChart.setOption(scatterOption);
</script>

</body>
</html>
